<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>spaceparty.io status</title>
<!--
  The status page the game's offline screen links to. It lives on GitHub Pages, away from the game's own servers, so it
  still loads when the game cannot. Plain HTML: no script, no font, no request to anywhere else.

  To post a notice: set the status block's data-state to "trouble" (or "normal" when it is fixed), change its two
  lines, and add the notice at the top of the list with its date and time in UTC. Then commit to gh-pages.
-->
<style>
:root {
  --bg: #070b1c;
  --card: #10162f;
  --line: rgba(244, 237, 224, 0.1);
  --text: #f4ede0;
  --muted: #bdb8cc;
  --quiet: #8e8aa6;
  --normal: #7ee0b8;
  --trouble: #ffd27a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 34rem;
  margin: 0 auto;
  padding: 3rem 1rem 4rem;
}
h1 {
  margin: 0 0 1.5rem;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--quiet);
}
.status {
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  padding: 1.25rem;
  border: 1px solid var(--line);
  border-radius: 1.25rem;
  background: var(--card);
}
.dot {
  flex: none;
  width: 0.875rem;
  height: 0.875rem;
  margin-top: 0.4rem;
  border-radius: 50%;
  background: var(--normal);
  box-shadow: 0 0 0 0.35rem rgba(126, 224, 184, 0.16);
}
.status[data-state="trouble"] .dot {
  background: var(--trouble);
  box-shadow: 0 0 0 0.35rem rgba(255, 210, 122, 0.16);
}
.status h2 {
  margin: 0;
  font-size: 1.375rem;
  line-height: 1.3;
}
.status p {
  margin: 0.25rem 0 0;
  color: var(--muted);
}
h3 {
  margin: 2.5rem 0 0.75rem;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--quiet);
}
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}
li {
  padding: 1rem 0;
  border-top: 1px solid var(--line);
}
li time {
  display: block;
  font-size: 0.875rem;
  color: var(--quiet);
}
li p {
  margin: 0.25rem 0 0;
}
.empty {
  margin: 0;
  color: var(--muted);
}
.links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 2.5rem;
}
.links a {
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: 0 1.125rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.links a:hover,
.links a:focus-visible {
  border-color: rgba(244, 237, 224, 0.35);
}
footer {
  margin-top: 2rem;
  font-size: 0.875rem;
  color: var(--quiet);
}
</style>
</head>
<body>
<main>
  <h1>spaceparty.io status</h1>

  <section class="status" data-state="normal" aria-labelledby="now">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <h2 id="now">Everything is flying normally</h2>
      <p>If the game will not load for you, check your connection and try again in a minute.</p>
    </div>
  </section>

  <h3>Notices</h3>
  <!--
    A notice, newest first:
    <li><time datetime="2026-10-06T14:05Z">Oct 6, 2026, 14:05 UTC</time><p>What happened, and what to do.</p></li>
  -->
  <ol>
    <li><p class="empty">No notices.</p></li>
  </ol>

  <nav class="links" aria-label="Links">
    <a href="https://spaceparty.io">Back to the game</a>
    <a href="mailto:hello@spaceparty.io">Write to us</a>
  </nav>

  <footer>
    <p>Updated <time datetime="2026-10-06">Oct 6, 2026</time>. This page is updated by hand when something goes wrong.</p>
  </footer>
</main>
</body>
</html>
